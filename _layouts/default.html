<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  {% seo %}
</head>
<body>
  <div class="wrapper">
    <header>
      <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Blog</a> |
        <a href="https://comicfire.com/">ComicFire</a> |
        <a href="https://app.comicfire.com/">App</a>
      </nav>
      {% if site.logo %}
      <picture class="profile-logo">
        {% if site.logo_webp %}<source srcset="{{ site.logo_webp | escape }}" type="image/webp">{% endif %}
        <img src="{{ site.logo | escape }}" width="256" height="256" alt="ComicFire icon">
      </picture>
      {% endif %}
    </header>
    <section>
      {{ content }}
    </section>
    <footer></footer>
  </div>
  <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
</body>
</html>
